<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <!-- Tailwind Play CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <title>Agro AI — Вход</title>
</head>
<body class="bg-gradient-to-br from-green-400 to-blue-500 h-screen flex items-center justify-center">

  <div class="bg-white bg-opacity-90 backdrop-blur-md rounded-2xl shadow-xl p-8 w-80">
    <h1 class="text-3xl font-extrabold text-center text-gray-800 mb-6">Agro AI</h1>

    <input id="user" type="text" placeholder="Имя пользователя"
           class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-300"/>

    <input id="pass" type="password" placeholder="Пароль"
           class="w-full p-3 mb-6 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-300"/>

    <button id="submit"
            class="w-full py-3 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-lg transition">
      Войти
    </button>

    <p id="error" class="text-red-500 mt-3 text-center hidden"></p>
  </div>
  <script type="module" src="../public/main.js"></script>
</body>
</html>
